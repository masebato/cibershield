  # ── SCN — Cumplimiento Normativo ───────────────────────────────────────────

  /api/scn/evaluate:
    post:
      tags: [Compliance]
      summary: Evaluar cumplimiento normativo
      description: Evalúa hallazgos contra las normas del sector (ISO 27001, Circular 052 SFC, Ley 1581, etc.).
      operationId: scn.evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [findings]
              properties:
                findings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Finding'
                  minItems: 1
                sector:
                  type: string
            example:
              sector: "fintech"
              findings:
                - id: 1
                  type: "CVE-2023-44487"
                  description: "HTTP/2 Rapid Reset Attack"
                  cvssScore: 7.5
                  level: "alto"
                  affectedAsset: "181.58.100.42"
                  recommendation: "Actualizar servidor web"
      responses:
        '200':
          description: Resultado de cumplimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceResult'
              example:
                sector: "fintech"
                complianceStatus: "partial"
                nonCompliantCount: 2
                compliantCount: 0
                observations:
                  - ruleId: "ISO-A.12.6.1"
                    norm: "ISO 27001"
                    title: "Gestión de vulnerabilidades técnicas"
                    compliant: false
                    findingRef: 1
                    observation: "Vulnerabilidad CVE-2023-44487 con CVSS 7.5 no corregida"
                    recommendation: "Aplicar parche en máximo 30 días"
                  - ruleId: "SFC-052-3.1"
                    norm: "Circular 052 SFC"
                    title: "Gestión de riesgos de seguridad"
                    compliant: false
                    findingRef: 1
                    observation: "Riesgo alto detectado en activo expuesto"
                    recommendation: "Aplicar parche inmediatamente"
        '400':
          description: Hallazgos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "La lista de hallazgos no puede estar vacía"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error al evaluar cumplimiento"

