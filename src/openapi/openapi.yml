openapi: 3.0.3

info:
  title: CiberShield Colombia API
  version: 1.0.0
  description: >
    Plataforma SOA de monitoreo de ciberseguridad para PYMEs colombianas.
    Centraliza autenticación, escaneo de activos, análisis de riesgos,
    alertas, cumplimiento normativo y generación de reportes ejecutivos.

servers:
  - url: https://cibershield-production.up.railway.app
    description: Production
  - url: http://localhost:3000
    description: Local

tags:
  - name: Gateway
    description: Estado del gateway
  - name: Auth
    description: Autenticación y gestión de usuarios
  - name: Shodan
    description: Consultas al conector Shodan (SCS)
  - name: Analysis
    description: Análisis de riesgos por activo (SAR)
  - name: Alerts
    description: Alertas y notificaciones (SAN)
  - name: Compliance
    description: Cumplimiento normativo (SCN)
  - name: Reports
    description: Reportes ejecutivos (SRE)

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    AccessTokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImNvbXBhbnlfaWQiOjEsInJvbGUiOiJhZG1pbiJ9.abc123"
        refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImNvbXBhbnlfaWQiOjEsInJvbGUiOiJhZG1pbiJ9.xyz789"

    Asset:
      type: object
      required: [id, type, value, created_at]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [ip, cidr, domain, subdomain]
        value:
          type: string
        created_at:
          type: string
          format: date-time
      example:
        id: 1
        type: ip
        value: "181.58.100.42"
        created_at: "2026-04-28T10:00:00.000Z"

    UserProfile:
      type: object
      required: [id, email, role, company_id, company_name, assets]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
        company_id:
          type: integer
        company_name:
          type: string
        sector:
          type: string
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
      example:
        id: 1
        email: "admin@miempresa.com"
        role: "admin"
        company_id: 1
        company_name: "Mi Empresa S.A.S"
        sector: "fintech"
        assets:
          - id: 1
            type: ip
            value: "181.58.100.42"
            created_at: "2026-04-28T10:00:00.000Z"
          - id: 2
            type: domain
            value: "miempresa.com"
            created_at: "2026-04-28T10:05:00.000Z"

    Finding:
      type: object
      required: [id, type, description, cvssScore, level, affectedAsset, recommendation]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        cvssScore:
          type: number
          format: float
          minimum: 0
          maximum: 10
        level:
          type: string
          enum: [critico, alto, medio, bajo]
        affectedAsset:
          type: string
        recommendation:
          type: string
      example:
        id: 1
        type: "CVE-2023-44487"
        description: "HTTP/2 Rapid Reset Attack permite DoS mediante cancelación masiva de streams"
        cvssScore: 7.5
        level: "alto"
        affectedAsset: "181.58.100.42"
        recommendation: "Actualizar servidor web a versión parcheada y limitar streams concurrentes"

    AnalysisResult:
      type: object
      required: [analysisId, ip, globalRisk, maxCvss, findings, analyzedAt]
      properties:
        analysisId:
          type: integer
        ip:
          type: string
        globalRisk:
          type: string
          enum: [critico, alto, medio, bajo]
        maxCvss:
          type: number
          format: float
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        analyzedAt:
          type: string
          format: date-time
      example:
        analysisId: 1
        ip: "181.58.100.42"
        globalRisk: "alto"
        maxCvss: 7.5
        analyzedAt: "2026-04-28T10:30:00.000Z"
        findings:
          - id: 1
            type: "CVE-2023-44487"
            description: "HTTP/2 Rapid Reset Attack permite DoS mediante cancelación masiva de streams"
            cvssScore: 7.5
            level: "alto"
            affectedAsset: "181.58.100.42"
            recommendation: "Actualizar servidor web a versión parcheada y limitar streams concurrentes"
          - id: 2
            type: "CVE-2022-22965"
            description: "Spring4Shell - Ejecución remota de código en Spring Framework"
            cvssScore: 9.8
            level: "critico"
            affectedAsset: "181.58.100.42"
            recommendation: "Actualizar Spring Framework a versión 5.3.18 o superior"

    Alert:
      type: object
      required: [id, company_id, type, asset, risk_level, summary, read, created_at]
      properties:
        id:
          type: integer
        company_id:
          type: integer
        type:
          type: string
        asset:
          type: string
        risk_level:
          type: string
          enum: [critico, alto, medio, bajo]
        summary:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
      example:
        id: 1
        company_id: 1
        type: "vulnerability_detected"
        asset: "181.58.100.42"
        risk_level: "alto"
        summary: "Se detectó vulnerabilidad CVE-2023-44487 (CVSS 7.5) en el host 181.58.100.42"
        read: false
        created_at: "2026-04-28T10:30:00.000Z"

    ComplianceObservation:
      type: object
      required: [ruleId, norm, title, compliant]
      properties:
        ruleId:
          type: string
        norm:
          type: string
        title:
          type: string
        compliant:
          type: boolean
        findingRef:
          type: integer
        observation:
          type: string
        recommendation:
          type: string
      example:
        ruleId: "ISO-A.12.6.1"
        norm: "ISO 27001"
        title: "Gestión de vulnerabilidades técnicas"
        compliant: false
        findingRef: 1
        observation: "Vulnerabilidad CVE-2023-44487 con CVSS 7.5 detectada y no corregida"
        recommendation: "Aplicar parche de seguridad en un plazo máximo de 30 días"

    ComplianceResult:
      type: object
      required: [sector, complianceStatus, nonCompliantCount, compliantCount, observations]
      properties:
        sector:
          type: string
        complianceStatus:
          type: string
          enum: [compliant, partial, non_compliant]
        nonCompliantCount:
          type: integer
        compliantCount:
          type: integer
        observations:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceObservation'
      example:
        sector: "fintech"
        complianceStatus: "partial"
        nonCompliantCount: 2
        compliantCount: 1
        observations:
          - ruleId: "ISO-A.12.6.1"
            norm: "ISO 27001"
            title: "Gestión de vulnerabilidades técnicas"
            compliant: false
            findingRef: 1
            observation: "Vulnerabilidad CVE-2023-44487 con CVSS 7.5 detectada y no corregida"
            recommendation: "Aplicar parche de seguridad en un plazo máximo de 30 días"
          - ruleId: "SFC-052-3.1"
            norm: "Circular 052 SFC"
            title: "Gestión de riesgos de seguridad"
            compliant: false
            findingRef: 2
            observation: "Riesgo crítico detectado en activo expuesto a internet"
            recommendation: "Aislar el servicio y aplicar parche inmediatamente"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: "Descripción del error ocurrido"

security:
  - bearerAuth: []

paths:

  # ── Gateway ────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Gateway]
      summary: Estado del gateway
      description: Endpoint público de liveness. No requiere autenticación.
      operationId: gateway.health
      security: []
      responses:
        '200':
          description: Gateway operativo
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service:
                    type: string
                  status:
                    type: string
              example:
                service: "gateway"
                status: "ok"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  # ── Auth ──────────────────────────────────────────────────────────────────

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registro de nuevo usuario
      description: Crea una cuenta de empresa. Endpoint público.
      operationId: auth.register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, company_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                company_name:
                  type: string
                sector:
                  type: string
            example:
              email: "admin@miempresa.com"
              password: "MiPassword123"
              company_name: "Mi Empresa S.A.S"
              sector: "fintech"
      responses:
        '200':
          description: Registro exitoso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImNvbXBhbnlfaWQiOjEsInJvbGUiOiJhZG1pbiJ9.abc123"
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImNvbXBhbnlfaWQiOjEsInJvbGUiOiJhZG1pbiJ9.xyz789"
                user:
                  id: 1
                  email: "admin@miempresa.com"
                  role: "admin"
                  company_id: 1
                  company_name: "Mi Empresa S.A.S"
                  sector: "fintech"
                  assets: []
        '400':
          description: Datos inválidos o email ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Email already registered"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Inicio de sesión
      description: Autentica credenciales y retorna tokens JWT. Endpoint público.
      operationId: auth.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: "admin@miempresa.com"
              password: "MiPassword123"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImNvbXBhbnlfaWQiOjEsInJvbGUiOiJhZG1pbiJ9.abc123"
                refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImNvbXBhbnlfaWQiOjEsInJvbGUiOiJhZG1pbiJ9.xyz789"
        '400':
          description: Credenciales malformadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "El campo email es requerido"
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid credentials"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cierre de sesión
      description: Invalida el refresh token del usuario.
      operationId: auth.logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
            example:
              refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImNvbXBhbnlfaWQiOjEsInJvbGUiOiJhZG1pbiJ9.xyz789"
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Sesión cerrada correctamente"
        '400':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired refresh token"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Missing or malformed Authorization header"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Obtener perfil del usuario
      description: Retorna el perfil del usuario autenticado junto con su empresa y activos.
      operationId: auth.profile.get
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 1
                email: "admin@miempresa.com"
                role: "admin"
                company_id: 1
                company_name: "Mi Empresa S.A.S"
                sector: "fintech"
                assets:
                  - id: 1
                    type: ip
                    value: "181.58.100.42"
                    created_at: "2026-04-28T10:00:00.000Z"
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

    put:
      tags: [Auth]
      summary: Actualizar perfil de empresa
      description: Modifica el nombre de empresa y/o sector del usuario autenticado.
      operationId: auth.profile.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                sector:
                  type: string
            example:
              company_name: "Mi Empresa Actualizada S.A.S"
              sector: "salud"
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 1
                email: "admin@miempresa.com"
                role: "admin"
                company_id: 1
                company_name: "Mi Empresa Actualizada S.A.S"
                sector: "salud"
                assets: []
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Datos de perfil inválidos"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  /api/auth/assets:
    post:
      tags: [Auth]
      summary: Registrar activo
      description: Agrega un activo (IP, CIDR, dominio, subdominio) a la empresa del usuario.
      operationId: auth.assets.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type:
                  type: string
                  enum: [ip, cidr, domain, subdomain]
                value:
                  type: string
            example:
              type: ip
              value: "181.58.100.42"
      responses:
        '200':
          description: Activo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
              example:
                id: 1
                type: ip
                value: "181.58.100.42"
                created_at: "2026-04-28T10:00:00.000Z"
        '400':
          description: Tipo o valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "El activo ya existe para esta empresa"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  /api/auth/assets/{id}:
    delete:
      tags: [Auth]
      summary: Eliminar activo
      description: Elimina un activo registrado por su ID.
      operationId: auth.assets.delete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del activo
          example: 1
      responses:
        '200':
          description: Activo eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Activo eliminado correctamente"
        '400':
          description: ID inválido o activo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Asset not found or not owned by company"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  /api/auth/password-reset:
    post:
      tags: [Auth]
      summary: Solicitar restablecimiento de contraseña
      description: Envía un email con enlace de recuperación. Endpoint público.
      operationId: auth.passwordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: "admin@miempresa.com"
      responses:
        '200':
          description: Respuesta enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Si el correo existe, recibirá instrucciones de recuperación"
        '400':
          description: Email inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Formato de email inválido"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error interno del servidor"

  # ── SCS — Shodan Connector ─────────────────────────────────────────────────

  /api/scs/health:
    get:
      tags: [Shodan]
      summary: Estado del conector Shodan
      description: Verifica conectividad con la API de Shodan.
      operationId: scs.health
      responses:
        '200':
          description: Conector operativo
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service:
                    type: string
                  status:
                    type: string
              example:
                service: "scs"
                status: "ok"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno o Shodan no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "No se pudo conectar con la API de Shodan"

  /api/scs/host:
    post:
      tags: [Shodan]
      summary: Información de un host
      description: Obtiene datos de Shodan para una dirección IP específica.
      operationId: scs.host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
            example:
              ip: "8.8.8.8"
      responses:
        '200':
          description: Datos del host
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                ip_str: "8.8.8.8"
                org: "Google LLC"
                country_name: "United States"
                ports: [53, 443]
                vulns:
                  CVE-2023-44487:
                    cvss: 7.5
                    summary: "HTTP/2 Rapid Reset Attack"
                hostnames: ["dns.google"]
                os: null
                last_update: "2026-04-27T00:00:00.000Z"
        '400':
          description: IP inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "IP address is not valid"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "No information available for that IP"

  /api/scs/search:
    post:
      tags: [Shodan]
      summary: Búsqueda en Shodan
      description: Ejecuta una búsqueda en Shodan. En capa gratuita (sin query credits) solo permite página 1 y sin filtros.
      operationId: scs.search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                page:
                  type: integer
                  minimum: 1
                  default: 1
                minify:
                  type: boolean
                  default: true
            example:
              query: "apache"
              page: 1
              minify: true
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                total: 1250
                matches:
