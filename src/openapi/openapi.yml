              schema:
                type: array
                items:
                  type: object
                  required: [id, norm, title, sector]
                  properties:
                    id:
                      type: string
                    norm:
                      type: string
                    title:
                      type: string
                    sector:
                      type: string
                    description:
                      type: string
              example:
                - id: "ISO-A.12.6.1"
                  norm: "ISO 27001"
                  title: "Gestión de vulnerabilidades técnicas"
                  sector: "*"
                  description: "Control de vulnerabilidades en sistemas de información"
                - id: "SFC-052-3.1"
                  norm: "Circular 052 SFC"
                  title: "Gestión de riesgos de seguridad"
                  sector: "fintech"
