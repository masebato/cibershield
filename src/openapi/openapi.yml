  # ── SCN — Cumplimiento Normativo ───────────────────────────────────────────

  /api/scn/evaluate:
    post:
      tags: [Compliance]
      summary: Evaluar cumplimiento normativo
      description: Evalúa hallazgos contra las normas del sector (ISO 27001, Circular 052 SFC, RGPD Colombia, etc.).
      operationId: scn.evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [findings]
              properties:
                findings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Finding'
                  minItems: 1
                sector:
                  type: string
      responses:
        '200':
          description: Resultado de cumplimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceResult'
        '400':
          description: Hallazgos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/scn/norms:
    get:
      tags: [Compliance]
      summary: Listar normas disponibles
      description: Retorna el catálogo de normas y reglas de cumplimiento configuradas en el sistema.
      operationId: scn.norms.list
      responses:
        '200':
          description: Catálogo de normas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, norm, title, sector]
                  properties:
                    id:
                      type: string
                    norm:
                      type: string
                    title:
                      type: string
                    sector:
                      type: string
                    description:
                      type: string
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── SRE — Reportes Ejecutivos ──────────────────────────────────────────────

  /api/sre/report/{companyId}/latest:
    get:
      tags: [Reports]
      summary: Obtener último reporte en PDF
      description: Descarga el reporte ejecutivo más reciente de la empresa en formato PDF.
      operationId: sre.report.latest
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reporte PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: ID de empresa inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sre/report/{companyId}/list:
    get:
      tags: [Reports]
      summary: Listar reportes de una empresa
      description: Retorna el historial de reportes ejecutivos generados para la empresa.
      operationId: sre.report.list
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de reportes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, company_id, asset, global_risk, generated_at]
                  properties:
                    id:
                      type: integer
                    company_id:
                      type: integer
                    asset:
                      type: string
                    global_risk:
                      type: string
                      enum: [critico, alto, medio, bajo]
                    analysis_id:
                      type: integer
                    generated_at:
                      type: string
                      format: date-time
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sre/report/{companyId}/generate:
    post:
      tags: [Reports]
      summary: Generar nuevo reporte ejecutivo
      description: Genera y persiste un reporte ejecutivo PDF para la empresa a partir de un análisis.
      operationId: sre.report.generate
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset]
              properties:
                analysisId:
                  type: integer
                asset:
                  type: string
                globalRisk:
                  type: string
                  enum: [critico, alto, medio, bajo]
      responses:
        '200':
          description: Reporte generado
          content:
            application/json:
              schema:
                type: object
                required: [id, company_id, asset, generated_at]
                properties:
                  id:
                    type: integer
                  company_id:
                    type: integer
                  asset:
                    type: string
                  global_risk:
                    type: string
                    enum: [critico, alto, medio, bajo]
                  analysis_id:
                    type: integer
                  generated_at:
                    type: string
                    format: date-time
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
