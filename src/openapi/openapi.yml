                error: "Análisis no encontrado"

  # ── SAN — Alertas & Notificaciones ────────────────────────────────────────

  /api/san/alerts:
    get:
      tags: [Alerts]
      summary: Listar alertas de la empresa
      description: Retorna las alertas de seguridad de la empresa del usuario autenticado, con soporte para filtrar no leídas y paginación.
      operationId: san.alerts.list
      parameters:
        - in: query
          name: unread
          schema:
            type: boolean
          description: Filtrar solo alertas no leídas
          example: true
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
              example:
                - id: 1
                  company_id: 1
                  type: "vulnerability_detected"
                  asset: "181.58.100.42"
                  risk_level: "alto"
                  summary: "Se detectó CVE-2023-44487 (CVSS 7.5) en el host 181.58.100.42"
                  read: false
                  created_at: "2026-04-28T10:30:00.000Z"
                - id: 2
                  company_id: 1
                  type: "new_port_open"
                  asset: "181.58.100.42"
                  risk_level: "medio"
                  summary: "Puerto 3306 (MySQL) expuesto públicamente"
                  read: false
                  created_at: "2026-04-28T09:00:00.000Z"
