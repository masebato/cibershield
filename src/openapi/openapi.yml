                properties:
                  id:
                    type: integer
                  company_id:
                    type: integer
                  asset:
                    type: string
                  global_risk:
                    type: string
                    enum: [critico, alto, medio, bajo]
                  analysis_id:
                    type: integer
                  generated_at:
                    type: string
