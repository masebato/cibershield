  # ── SAR — Análisis de Riesgos ──────────────────────────────────────────────

  /api/sar/analyze:
    post:
      tags: [Analysis]
      summary: Analizar un activo
      description: Ejecuta análisis de riesgo completo sobre una IP, CIDR o dominio y retorna hallazgos CVE.
      operationId: sar.analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_type, asset_value]
              properties:
                asset_type:
                  type: string
                  enum: [ip, cidr, domain]
                asset_value:
                  type: string
            example:
              asset_type: ip
              asset_value: "181.58.100.42"
      responses:
        '200':
          description: Resultado del análisis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
              example:
                analysisId: 1
                ip: "181.58.100.42"
                globalRisk: "alto"
                maxCvss: 7.5
                analyzedAt: "2026-04-28T10:30:00.000Z"
                findings:
                  - id: 1
                    type: "CVE-2023-44487"
                    description: "HTTP/2 Rapid Reset Attack permite DoS"
                    cvssScore: 7.5
                    level: "alto"
                    affectedAsset: "181.58.100.42"
                    recommendation: "Actualizar servidor web y limitar streams concurrentes"
        '400':
          description: Activo inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "El tipo de activo no es válido"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error al ejecutar el análisis"

  /api/sar/assets:
    get:
      tags: [Analysis]
      summary: Resumen de riesgos por empresa
      description: Retorna el estado de riesgo consolidado de todos los activos de la empresa del usuario autenticado.
      operationId: sar.assets.list
      responses:
        '200':
          description: Lista de activos con métricas de riesgo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [asset, global_risk, max_cvss, critical, high, medium, low]
                  properties:
                    asset:
                      type: string
                    global_risk:
                      type: string
                      enum: [critico, alto, medio, bajo]
                    max_cvss:
                      type: number
                      format: float
                    critical:
                      type: integer
                    high:
                      type: integer
                    medium:
                      type: integer
                    low:
                      type: integer
              example:
                - asset: "181.58.100.42"
                  global_risk: "alto"
                  max_cvss: 7.5
                  critical: 0
                  high: 2
                  medium: 1
                  low: 3
                - asset: "miempresa.com"
                  global_risk: "medio"
                  max_cvss: 5.4
                  critical: 0
                  high: 0
                  medium: 2
                  low: 1
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired token"
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error al obtener resumen de riesgos"

