                analysisId: 1
                ip: "181.58.100.42"
                globalRisk: "alto"
                maxCvss: 7.5
                analyzedAt: "2026-04-28T10:30:00.000Z"
                findings:
                  - id: 1
                    type: "CVE-2023-44487"
